# Baut die Alpha-APKs (Fassung play und direct, Debug-signiert, Test-Anzeigen) und lädt sie als Artefakt hoch.
# Start: bei jedem Push auf main oder von Hand unter Actions → "Android Alpha" → "Run workflow".
#
# Optionale Secrets (Settings → Secrets and variables → Actions):
#   GOOGLE_SERVICES_JSON          Inhalt der google-services.json aus Firebase (ohne: Platzhalter, Login geht dann nicht)
#   TUYA_SECURITY_AAR_BASE64      security-algorithm.aar als Base64 (base64 -w0 security-algorithm.aar)
#   TUYA_APPKEY, TUYA_APPSECRET   Tuya App-SDK-Zugang
#   REVENUECAT_KEY_DEBUG          RevenueCat test_… oder goog_…-Key (ohne: keine Käufe)
name: Android Alpha
on:
  push:
    branches: [main]
    paths-ignore: ["backend/**", "docs/**", "*.md"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Firebase-Konfiguration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json aus Secret"
          else
            cp .github/ci/google-services.placeholder.json app/google-services.json
            echo "::warning::Kein GOOGLE_SERVICES_JSON-Secret: Platzhalter, Anmelden funktioniert in dieser APK nicht"
          fi

      - name: Tuya-Bibliothek
        env:
          TUYA_AAR: ${{ secrets.TUYA_SECURITY_AAR_BASE64 }}
        run: |
          mkdir -p app/libs
          if [ -n "$TUYA_AAR" ]; then
            printf '%s' "$TUYA_AAR" | base64 -d > app/libs/security-algorithm.aar
          else
            echo "::warning::Keine security-algorithm.aar: Tuya-Geräte funktionieren in dieser APK nicht"
          fi

      # Tests und APKs in einem Lauf; --continue baut die APKs auch, wenn ein Test scheitert
      - name: Unit-Tests und APKs
        env:
          VERSION_CODE: ${{ github.run_number }}
          TUYA_APPKEY: ${{ secrets.TUYA_APPKEY }}
          TUYA_APPSECRET: ${{ secrets.TUYA_APPSECRET }}
          REVENUECAT_KEY_DEBUG: ${{ secrets.REVENUECAT_KEY_DEBUG }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon --continue \
            testPlayDebugUnitTest assemblePlayDebug assembleDirectDebug 2>&1 | tee build.log

      - name: Fehler als Annotation
        if: failure()
        run: bash .github/ci/annotate-log.sh build.log

      - name: Abhängigkeiten prüfen
        if: failure()
        run: |
          if grep -q "Could not find " build.log; then
            m=$(grep -oE "Could not find [^ ]+\." build.log | head -1 | sed -E 's/Could not find (.*)\./\1/')
            g=$(echo "$m" | cut -d: -f1 | tr . /); a=$(echo "$m" | cut -d: -f2); v=$(echo "$m" | cut -d: -f3)
            bash .github/ci/diagnose-deps.sh "$g/$a/$v"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grow-guardian-0.1.0-alpha-${{ github.run_number }}
          path: |
            app/build/outputs/apk/play/debug/*.apk
            app/build/outputs/apk/direct/debug/*.apk
          retention-days: 30
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-berichte
          path: app/build/reports/
